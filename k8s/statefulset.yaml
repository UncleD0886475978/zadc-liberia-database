apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zadc-postgresql
  namespace: zadc
  labels:
    app: zadc-postgresql
spec:
  serviceName: zadc-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app: zadc-postgresql
  template:
    metadata:
      labels:
        app: zadc-postgresql
    spec:
      containers:
        - name: db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: zadc-postgresql
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zadc-postgresql-data
